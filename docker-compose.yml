version: "3.8"

services:
  mysql-sakila:
    image: mysql:8.3
    container_name: mysql-sakila
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila
      MYSQL_USER: sakila
      MYSQL_PASSWORD: sakila
    ports:
      - "3307:3306"
    volumes:
      - ./src/main/sql/sakila-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/main/sql/sakila-data.sql:/docker-entrypoint-initdb.d/2-data.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-usakila", "-psakila" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - melian-network

  mongo:
    image: mongo:7
    container_name: mcp-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - melian-network

  melian-mcp-server:
    build: .
    container_name: melian-mcp-server
    ports:
      - "3000:3000"  # Spring Boot web server
      - "3001:3001"  # MCP server TCP
    depends_on:
      mysql-sakila:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MCP_SERVER_HTTP_ENABLED=true
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN}
    networks:
      - melian-network

volumes:
  mongo_data:

networks:
  melian-network:
    driver: bridge