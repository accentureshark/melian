# Streaming MELIAN Configuration
spring.datasource.url=jdbc:h2:mem:melian
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable JPA for streaming mode
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Server configuration
server.port=8080

# MELIAN configuration
melian.tmdb.api-url=https://api.themoviedb.org/3
melian.tmdb.access-token=${TMDB_ACCESS_TOKEN:}

# Logging
logging.level.org.shark.melian=INFO
logging.level.root=INFO