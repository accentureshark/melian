spring:
  application:
    name: melian-mcp-server

  ai:
    mcp:
      server:
        enabled: true
        stdio: true
        type: SYNC
        name: melian-movie-server
        version: 1.0.0
        resource-change-notification: true
        tool-change-notification: true
        prompt-change-notification: true
  main:
    web-application-type: none
    banner-mode: off

logging:
  pattern:
    console: ""
  # datasource:
  #   # Conexión a MySQL Sakila
  #   url: jdbc:mysql://localhost:3307/sakila?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
  #   username: sakila
  #   password: sakila
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  # jpa:
  #   hibernate:
  #     # Validamos que el esquema exista, pero no lo modificamos
