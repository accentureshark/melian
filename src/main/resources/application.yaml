server:
  port: 8090

spring:
  application:
    name: melian-mcp-server
  datasource:
    # Conexión a MySQL Sakila
    url: jdbc:mysql://localhost:3307/sakila?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

    username: sakila
    password: sakila
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Validamos que el esquema exista, pero no lo modificamos
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    root: INFO
    org.shark.melian: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# (Opcional) Configuración MELIAN previa si la estás usando
melian:
  adapters:
    enabled:
      - sql
      - filesystem
    sql:
      default-schema: sakila
      chunking:
        mode: row
        max-chunks: 50
        enrichment: true
  embedding:
    provider: ollama
    model: nomic-embed-text
    device: cpu
    batch-size: 16
    timeout-ms: 15000

# Variables de entorno alternas:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.
