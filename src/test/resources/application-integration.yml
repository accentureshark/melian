spring:
  application:
    name: melian-mcp-server-integration-test
  
  ai:
    mcp:
      server:
        enabled: true
        stdio: true
        type: SYNC
        name: melian-movie-server-test
        version: 1.0.0
        
  main:
    web-application-type: none
    banner-mode: off
    
  # Database configuration will be set by TestContainers
  datasource:
    # Will be overridden by TestContainers
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        
  data:
    mongodb:
      # Will be overridden by TestContainers
      uri: mongodb://localhost:27017/test

# TMDB API configuration (will be mocked)
tmdb:
  api-url: http://localhost:8089
  access-token: test-token

# Logging configuration
logging:
  level:
    root: INFO
    org.shark.melian: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN